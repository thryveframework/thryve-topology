name: Release

# Publishing a release on GitHub's website (which makes its tag) builds the viewer for each
# platform and attaches the archives to that release. A manual run from the Actions tab builds and
# packages on any branch without publishing anything: the archives stay on the run's page.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: Topology
  PACKAGE_NAME: thryve-topology

# Only the job that attaches the archives writes to the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # GitHub's Intel macOS runner, since macos-13 was retired.
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      # The archives are named after the version: the release's tag without its "v" (v0.1.0 gives
      # 0.1.0). A manual run uses its branch's name.
      - name: Package (zip, Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGE="${PACKAGE_NAME}-${GITHUB_REF_NAME#v}-${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}.exe" "$STAGE/"
          cp README.md LICENSE CHANGELOG.md "$STAGE/"
          7z a "${STAGE}.zip" "$STAGE" > /dev/null
          echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

      - name: Package (tar.gz, Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGE="${PACKAGE_NAME}-${GITHUB_REF_NAME#v}-${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGE/"
          cp README.md LICENSE CHANGELOG.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    # Only for a published release: a manual run never touches a release.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release already exists, with the notes written on the website. This only adds the
      # four archives to it, and keeps its notes.
      - name: Attach the archives
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
